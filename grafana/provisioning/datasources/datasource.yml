apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Bridge #2: a diamond marker on a histogram panel, keyed off the
      # trace_id exemplar label set in src/metrics.js, that jumps to Tempo.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Bridge #1: turns the trace_id field every backend/nginx JSON log line
      # carries (src/middleware/requestLogger.js) into a clickable link that
      # opens that request's full span tree in Tempo.
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"trace_id":"(\w+)"'
          name: TraceID
          url: '$${__value.raw}'

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # Bridge #1, reverse direction: from an open trace, jump to its
      # matching log lines in Loki. Can't scope the query by service first —
      # promtail-config.yml only labels streams by "container"/"service" from
      # the docker-compose service name (e.g. "backend"), which doesn't match
      # the OTEL service.name spans carry (e.g. "expense-backend") — so this
      # searches across all containers for the trace_id string instead.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        customQuery: true
        query: '{container=~".+"} |= "$${__trace.traceId}"'

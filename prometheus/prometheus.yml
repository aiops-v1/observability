global:
  scrape_interval: 15s

# claude-phase-4b.md: SLO recording + burn-rate alerting rules. No
# Alertmanager in this stack (deliberately out of scope, §7) — Prometheus
# still evaluates these and shows Inactive/Pending/Firing on its own Alerts
# page even with nothing to route notifications to.
rule_files:
  - /etc/prometheus/slo-rules.yml
  - /etc/prometheus/slo-alerts.yml
  - /etc/prometheus/cause-alerts.yml

scrape_configs:
  - job_name: 'expense-backend'
    static_configs:
      - targets: ['backend:4000']
        labels:
          tier: backend

  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']
        labels:
          tier: mysql

  - job_name: 'nginx-frontend'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          tier: frontend

  # claude-phase-4a.md: nginx-module-vts, scraped straight from nginx itself
  # (no separate exporter container needed, unlike stub_status above) — adds
  # request-duration histograms, which stub_status has no concept of at all.
  # Kept alongside the stub_status-based job above rather than replacing it:
  # the existing "MySQL connections & nginx request rate" Grafana panel
  # already depends on nginx_http_requests_total (nginx-exporter's metric
  # name), so retiring that job would silently break a working panel.
  - job_name: 'nginx-vts'
    static_configs:
      - targets: ['frontend:8080']
        labels:
          tier: frontend
    metrics_path: /status/format/prometheus

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          tier: infra

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          tier: infra

services:
  mysql:
    build: ../expense-mysql-v1
    container_name: expense-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: expense_tracker
      MYSQL_USER: expense_app
      MYSQL_PASSWORD: devpass
    volumes:
      - expense_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../expense-backend-v1
    container_name: backend
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: expense_app
      DB_PASSWORD: devpass
      DB_NAME: expense_tracker
      DB_POOL_SIZE: 10
      JWT_SECRET: change-me-to-a-long-random-string
      JWT_EXPIRES_IN: 7d
      FRONTEND_ORIGIN: http://localhost
      AUTH_MODE: cookie
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: expense-backend
    depends_on:
      mysql:
        condition: service_healthy
      otel-collector:
        condition: service_started

  frontend:
    build: ../expense-frontend-v1
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - otel-collector

  # --- Phase 2a: metrics collection (see ./prometheus, ./grafana) ---

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysqld-exporter
    # v0.15.x dropped DATA_SOURCE_NAME support — credentials come from a
    # mounted my.cnf file instead (see ./mysqld-exporter/.my.cnf).
    command:
      - --config.my-cnf=/etc/mysqld-exporter/.my.cnf
    volumes:
      - ./mysqld-exporter/.my.cnf:/etc/mysqld-exporter/.my.cnf:ro
    depends_on:
      mysql:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    command:
      - --nginx.scrape-uri=http://frontend:8080/stub_status
    depends_on:
      - frontend

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    # Docker >=20.10 gives containers a private cgroup namespace by default on
    # cgroup v2 hosts. Without this, cadvisor only ever sees its own isolated
    # view of the cgroup tree and can't enumerate sibling containers at all.
    cgroup: host
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    depends_on:
      - backend
      - frontend
      - mysql

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    # --enable-feature=exemplar-storage: off by default (still experimental
    # as of this pinned version) — without it, Prometheus silently drops the
    # exemplars src/metrics.js attaches on every observe() call, even though
    # everything else (the backend emitting them, Grafana's
    # exemplarTraceIdDestinations) is already correctly wired. Bridge #2 does
    # nothing without this flag.
    # Overriding command: replaces the image's default CMD entirely, so the
    # usual default flags are repeated here alongside the new one rather than
    # dropped.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - mysqld-exporter
      - nginx-exporter
      - cadvisor

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  # --- Phase 2b (continued): log shipping — Loki + Promtail ---

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    # No custom config mounted — the image's built-in local-config.yaml
    # (filesystem storage, single binary) is fine for a teaching lab and
    # keeps this light on a t3.micro. Not published to the host; only
    # Grafana and Promtail talk to it, over observability-net.

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    volumes:
      # Docker writes every container's stdout/stderr to JSON log files here
      # regardless of what format the app itself logs in — this is what
      # Promtail actually tails.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Needed for docker_sd_configs auto-discovery (container name/service
      # labels) — same auto-discovery instinct cadvisor uses for metrics.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # --- Phase 2c: traces — OTel Collector + Tempo ---

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: otel-collector
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol/config.yaml:ro
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4318:4318"
      - "4317:4317"
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    # Local-disk storage, single binary — fine for a teaching lab; object
    # storage is a real-deployment concern this POC doesn't need.
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro

volumes:
  expense_mysql_data:

networks:
  default:
    name: observability-net

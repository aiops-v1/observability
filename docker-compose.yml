services:
  mysql:
    build: ../expense-mysql-v1
    container_name: expense-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: expense_tracker
      MYSQL_USER: expense_app
      MYSQL_PASSWORD: devpass
    volumes:
      - expense_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../expense-backend-v1
    container_name: backend
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: expense_app
      DB_PASSWORD: devpass
      DB_NAME: expense_tracker
      DB_POOL_SIZE: 10
      JWT_SECRET: change-me-to-a-long-random-string
      JWT_EXPIRES_IN: 7d
      FRONTEND_ORIGIN: http://localhost
      AUTH_MODE: cookie
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: expense-backend
      # claude-phase-5.md — off by default, on purpose (§3.2: must never be
      # reachable outside an active teaching session). Uncomment only for
      # the duration of a Phase 5 failure-injection run, then comment back
      # out and `docker compose up -d --force-recreate backend`:
      ENABLE_DEBUG_ROUTES: "true"
      # claude-phase-6.md §6 — off by default, same reasoning as
      # ENABLE_DEBUG_ROUTES above. Requires the volumes: entry below to be
      # uncommented too, or /agent-remediation/restart will 500 (no socket
      # to talk to) even with the route registered.
      ENABLE_AGENT_REMEDIATION: "true"
    # claude-phase-6.md §6.2 — read-WRITE, unlike every other docker.sock
    # mount in this file (cadvisor/promtail/rca-agent below all mount it
    # :ro). This is the one place in the whole stack a container gets real
    # power over the Docker daemon — restart is scoped server-side to just
    # this container (routes/agentRemediation.js's ALLOWED_CONTAINERS), but
    # the mount itself doesn't know that; anything else that ever ran inside
    # this container would have the same access. Uncomment only alongside
    # ENABLE_AGENT_REMEDIATION above, for a supervised session, then remove
    # both and rebuild — don't leave this mounted long-term.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      otel-collector:
        condition: service_started

  frontend:
    build: ../expense-frontend-v1
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - otel-collector

  # --- Phase 2a: metrics collection (see ./prometheus, ./grafana) ---

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysqld-exporter
    # v0.15.x dropped DATA_SOURCE_NAME support — credentials come from a
    # mounted my.cnf file instead (see ./mysqld-exporter/.my.cnf).
    command:
      - --config.my-cnf=/etc/mysqld-exporter/.my.cnf
    volumes:
      - ./mysqld-exporter/.my.cnf:/etc/mysqld-exporter/.my.cnf:ro
    depends_on:
      mysql:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    command:
      - --nginx.scrape-uri=http://frontend:8080/stub_status
    depends_on:
      - frontend

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    # Docker >=20.10 gives containers a private cgroup namespace by default on
    # cgroup v2 hosts. Without this, cadvisor only ever sees its own isolated
    # view of the cgroup tree and can't enumerate sibling containers at all.
    cgroup: host
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    depends_on:
      - backend
      - frontend
      - mysql

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    # --enable-feature=exemplar-storage: off by default (still experimental
    # as of this pinned version) — without it, Prometheus silently drops the
    # exemplars src/metrics.js attaches on every observe() call, even though
    # everything else (the backend emitting them, Grafana's
    # exemplarTraceIdDestinations) is already correctly wired. Bridge #2 does
    # nothing without this flag.
    # Overriding command: replaces the image's default CMD entirely, so the
    # usual default flags are repeated here alongside the new one rather than
    # dropped.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/slo-rules.yml:/etc/prometheus/slo-rules.yml:ro
      - ./prometheus/slo-alerts.yml:/etc/prometheus/slo-alerts.yml:ro
      - ./prometheus/cause-alerts.yml:/etc/prometheus/cause-alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - mysqld-exporter
      - nginx-exporter
      - cadvisor
      - frontend

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  # --- Phase 2b (continued): log shipping — Loki + Promtail ---

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    # No custom config mounted — the image's built-in local-config.yaml
    # (filesystem storage, single binary) is fine for a teaching lab and
    # keeps this light on a t3.micro. Not published to the host; only
    # Grafana and Promtail talk to it, over observability-net.

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    volumes:
      # Docker writes every container's stdout/stderr to JSON log files here
      # regardless of what format the app itself logs in — this is what
      # Promtail actually tails.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Needed for docker_sd_configs auto-discovery (container name/service
      # labels) — same auto-discovery instinct cadvisor uses for metrics.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # --- Phase 2c: traces — OTel Collector + Tempo ---

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: otel-collector
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol/config.yaml:ro
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4318:4318"
      - "4317:4317"
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    # Local-disk storage, single binary — fine for a teaching lab; object
    # storage is a real-deployment concern this POC doesn't need.
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro

  # --- Phase 6: RCA agent (claude-phase-6.md) ---

  rca-agent:
    build: ../rca-agent
    container_name: rca-agent
    # Opt-in via Compose profiles: excluded from a plain `docker compose up`
    # (so it doesn't show up as a crash-looping/exited container every time
    # you bring the rest of the stack up without Anthropic/Slack
    # credentials configured) — start it explicitly once those are set:
    #   docker compose --profile rca-agent up -d --build rca-agent
    # (naming it directly also works without --profile, same as any other
    # explicitly-named service).
    profiles: ["rca-agent"]
    environment:
      # Plain (no `:?required` guard, deliberately): that syntax fails
      # variable interpolation for the WHOLE compose file the moment any one
      # of these three is unset — which would break every other
      # `docker compose` command against this file too (backend, prometheus,
      # anything), not just ones touching rca-agent. Left blank/unset here,
      # this service will build and start, then immediately exit on its own
      # (src/config.js's requireEnv throws) — loud failure scoped to just
      # this one container, not a landmine for the rest of the stack. Set
      # real values via observability/.env (docker compose reads it
      # automatically) before actually starting this service.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID}
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      BACKEND_INTERNAL_URL: http://backend:4000
    # claude-phase-6.md §7.1 — sibling container on the same network,
    # needed because check_docker_state requires the host-bound Docker
    # socket. :ro here, deliberately different from backend's read-write
    # mount above — this container only ever lists/inspects/reads logs; the
    # one write action (restart) is delegated to backend's own wrapper
    # instead of this container getting write access too.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - prometheus
      - loki
      - tempo
      - backend

volumes:
  expense_mysql_data:

networks:
  default:
    name: observability-net
